# Deploys the site to GitHub Pages on every push to main. The files in git stay as written; this stamps
# a copy with content hashes (dev/stamp.py) so browsers never pair new HTML with a cached old stylesheet
# or script. Needs Settings → Pages → Source set to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy the site and stamp it
        run: |
          mkdir _site
          cp -r index.html css js _site/
          python3 dev/stamp.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
